<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CineTot</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="canvas">

  <div id="header">
    <div id="title">CineTot</div>
    <select id="language-select"></select>
  </div>

  <div id="setup-panel">
    <label id="setup-label">Your Known Words (Optional)</label>
    <textarea id="known-words" placeholder="e.g. ship, space, father, sword, robot, princess..."></textarea>
    <div id="setup-hint">The AI will prioritize these words and teach you 2-3 new ones similar in level.</div>
  </div>

  <button id="start-btn">Tell me a story!</button>

  <div id="error-box"></div>

  <div id="story-card">
    <div id="story-emoji"></div>
    <div id="story-text"></div>
    <div id="story-hint">Click highlighted words to learn</div>
  </div>

  <div id="quiz-title">Which movie is this?</div>
  <button class="option-btn" id="option-0"></button>
  <button class="option-btn" id="option-1"></button>
  <button class="option-btn" id="option-2"></button>
  <button class="option-btn" id="option-3"></button>
  <div id="feedback"></div>

  <div id="footer">Powered by OpenRouter</div>

  <div id="word-overlay">
    <div id="word-modal">
      <div id="word-modal-header">
        <span id="word-modal-title"></span>
        <button id="word-modal-close">&times;</button>
      </div>
      <div id="word-modal-body">
        <div id="word-menu">
          <div id="word-menu-prompt"></div>
          <button id="word-explain-btn">Explain It — Definitions &amp; Counter-examples</button>
        </div>
        <div id="word-explain-view">
          <div id="word-loading">Analyzing word...</div>
          <div id="word-explanations"></div>
          <div id="word-counterexamples"></div>
          <button id="word-back-btn">Back to Menu</button>
        </div>
      </div>
    </div>
  </div>

</div>
<script src="/app.js"></script>
</body>
</html>
